name: Validate AI handoff

on:
  push:
    paths:
      - "coordination/**"
      - ".github/workflows/ai-handoff-validate.yml"
  pull_request:
    paths:
      - "coordination/**"
      - ".github/workflows/ai-handoff-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate handoff state
        run: python3 coordination/validate_state.py
