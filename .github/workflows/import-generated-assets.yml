name: Import generated assets

on:
  push:
    branches:
      - main
      - coordination-v4
    paths:
      - "production/import-queue/*.json"
  workflow_dispatch:
    inputs:
      manifest_path:
        description: "Exact production/import-queue/*.json manifest"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: alice-binary-import-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install Pillow
        run: python3 -m pip install --quiet pillow

      - name: Resolve manifests from this event only
        id: manifests
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            p='${{ inputs.manifest_path }}'
            [[ "$p" == production/import-queue/*.json ]] || { echo "invalid manifest path" >&2; exit 1; }
            [[ -f "$p" ]] || { echo "manifest missing: $p" >&2; exit 1; }
            printf '%s\n' "$p" > /tmp/manifests.txt
          else
            git diff --name-status HEAD^ HEAD -- 'production/import-queue/*.json' > /tmp/manifest-diff.txt
            : > /tmp/manifests.txt
            while IFS=$'\t' read -r status path; do
              [[ -z "${status:-}" ]] && continue
              [[ "$status" == "A" ]] || { echo "queue manifests are immutable; use a new slug instead of $status $path" >&2; exit 1; }
              echo "$path" >> /tmp/manifests.txt
            done < /tmp/manifest-diff.txt
          fi
          [[ -s /tmp/manifests.txt ]] || { echo "no new manifests in triggering commit" >&2; exit 1; }
          cat /tmp/manifests.txt

      - name: Process each manifest independently
        id: import
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          while IFS= read -r manifest; do
            echo "==> $manifest"
            python3 production/import_generated_asset.py "$manifest" --write-rejection || failed=1
          done < /tmp/manifests.txt
          echo "failed=$failed" >> "$GITHUB_OUTPUT"

      - name: Commit successful imports and rejection receipts
        shell: bash
        run: |
          set -euo pipefail
          branch='${{ github.ref_name }}'
          [[ "$branch" == "main" || "$branch" == "coordination-v4" ]] || { echo "unexpected import branch: $branch" >&2; exit 2; }
          if git status --porcelain | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add content/ production/import-receipts/ production/import-rejected/ 2>/dev/null || true
            if ! git diff --cached --quiet; then
              git commit -m "binary-import: process manifest(s) [skip ci]"
              git pull --rebase origin "$branch"
              git push origin "HEAD:$branch"
            fi
          fi

      - name: Surface rejected manifest without poisoning queue
        if: steps.import.outputs.failed == '1'
        run: |
          echo "At least one manifest was rejected. Rejection receipt was committed; other manifests were still processed." >&2
          exit 1
