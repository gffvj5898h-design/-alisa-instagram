name: Import generated assets

on:
  push:
    paths:
      - "production/import-queue/*.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import pending binary assets
        run: python3 production/import_generated_asset.py --all

      - name: Commit imported assets and receipts
        shell: bash
        run: |
          if git status --porcelain | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add content/ production/import-receipts/
            git commit -m "Import generated asset(s) [skip ci]"
            git push
          else
            echo "No imported assets to commit"
          fi
