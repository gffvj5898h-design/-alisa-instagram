name: Import approved Reels

on:
  issues:
    types: [opened]
  push:
    paths:
      - '.github/workflows/import-approved-reels.yml'

permissions:
  contents: write

jobs:
  import-approved-reels:
    if: github.event_name == 'push' || github.event.issue.title == 'IMPORT_APPROVED_REELS_001_003'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download approved masters
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p content/reels/001-first-date/output/approved
          mkdir -p content/reels/002-bad-date-home/output/approved
          mkdir -p content/reels/003-morning-after/output/approved

          curl -fL --retry 3 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/c182939f-5cdc-4d98-8332-706837254aa5.mp4?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYTNkNWQ5YTQ5ZjRhZjRlYiIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc4NzUwMTA5Mn0.ql5tKZjMzvO2agS9bgM_gGubdZ6YAGYKMyl6q1Jjwao' -o content/reels/001-first-date/output/approved/reels-001-approved.mp4

          curl -fL --retry 3 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/e7132af9-4f39-4e75-8148-1ecb028ce69c.mp4?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiOTcyNTIxYTI3ZDU2MWMxNyIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc4NzQ4MjY1OH0.IVQdXl5TxcS5z-9DPcM6mvSYP8FqeaMl3W7jbjLfRm8' -o content/reels/002-bad-date-home/output/approved/reels-002-approved.mp4

          curl -fL --retry 3 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/0861106d-1fc5-48de-8bfb-be37833b1f76.mp4?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZTNmNGEwZjg4N2ViMThhZiIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc4NzQ5MzYyNH0.26k5iJS7BQuWWnKT7Dxpc7HA-5DMjgfcZ9oe7RPrFUs' -o content/reels/003-morning-after/output/approved/reels-003-approved.mp4

      - name: Verify hashes
        shell: bash
        run: |
          set -euo pipefail
          echo '5259ee5c812bfbf43658531392fcc8b47704531a4b804fede86a11422ad0f736  content/reels/001-first-date/output/approved/reels-001-approved.mp4' | sha256sum -c -
          echo '94cb5b9aa4524d729092f766588717c9a7d85791c55e04d69f1f7cf703e12b5d  content/reels/002-bad-date-home/output/approved/reels-002-approved.mp4' | sha256sum -c -
          echo 'a09f09486c78b2f1fd73591fffeae67a8328099bdbbd3e6789455907b41e60a3  content/reels/003-morning-after/output/approved/reels-003-approved.mp4' | sha256sum -c -

      - name: Commit videos
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/reels/001-first-date/output/approved/reels-001-approved.mp4 \
                  content/reels/002-bad-date-home/output/approved/reels-002-approved.mp4 \
                  content/reels/003-morning-after/output/approved/reels-003-approved.mp4
          git commit -m 'Add approved Reels 001-003 masters'
          git push
