name: Probe firestorage share HTML once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-firestorage-html-once.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe share page without downloading asset
        shell: bash
        env:
          SHARE_URL: 'https://firestorage.ai/ja/f/uBRYlUuRpn-t'
          EXPECTED_FILE: 'avatar-candidate-square-1080.jpg'
        run: |
          python3 - <<'PY'
          import os, re, html
          from urllib.request import Request, urlopen
          from urllib.parse import urljoin
          u=os.environ['SHARE_URL']; fn=os.environ['EXPECTED_FILE']
          req=Request(u,headers={'User-Agent':'Mozilla/5.0'})
          with urlopen(req,timeout=30) as r:
              body=r.read().decode('utf-8','replace'); final=r.geturl(); ct=r.headers.get('content-type')
          print('status=ok final=',final,'content-type=',ct,'chars=',len(body))
          title=re.search(r'<title[^>]*>(.*?)</title>',body,re.I|re.S)
          print('title=',html.unescape(re.sub('<[^>]+>',' ',title.group(1))).strip() if title else '<none>')
          hrefs=re.findall(r'href=["\']([^"\']+)',body,re.I)
          print('candidate hrefs:')
          for h in hrefs:
              x=urljoin(final,html.unescape(h))
              low=x.lower()
              if any(k in low for k in ('download','file','api','storage','asset')):
                  print(x)
          print('script srcs:')
          for s in re.findall(r'<script[^>]+src=["\']([^"\']+)',body,re.I):
              print(urljoin(final,html.unescape(s)))
          for needle in (fn,'download','publicId','file_id','01a0782231247758bef5513f5eeb6c97','g95RF7RWPZ7nTcKe'):
              print('--- needle',needle,'---')
              for m in list(re.finditer(re.escape(needle),body,re.I))[:8]:
                  a=max(0,m.start()-220); b=min(len(body),m.end()+420)
                  snippet=re.sub(r'\s+',' ',body[a:b])
                  print(snippet)
          PY
