name: Probe firestorage share HTML once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-firestorage-html-once.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Target firestorage download API discovery
        shell: bash
        env:
          SHARE_URL: 'https://firestorage.ai/ja/f/uBRYlUuRpn-t'
        run: |
          python3 - <<'PY'
          import os,re,html
          from urllib.request import Request,urlopen
          from urllib.parse import urljoin
          def get(u):
              with urlopen(Request(u,headers={'User-Agent':'Mozilla/5.0'}),timeout=30) as r:
                  return r.read().decode('utf-8','replace'),r.geturl()
          body,final=get(os.environ['SHARE_URL'])
          scripts=[urljoin(final,html.unescape(s)) for s in re.findall(r'<script[^>]+src=["\']([^"\']+)',body,re.I)]
          focus=[s for s in scripts if '/app/(files)/' in s or s.endswith('5841-1160578ba9bb4f3e.js') or s.endswith('4899-d89df949f2dbd5af.js')]
          needles=['api.firestorage.ai','downloadUrl','downloadURL','download_url','presign','signedUrl','signedURL','publicId','shareId','share_url','fileId','files/','downloads','download','/prod/file','/prod/']
          for s in focus:
              js,_=get(s)
              print('\n===',s,'chars',len(js),'===')
              low=js.lower()
              shown=set()
              for needle in needles:
                  pos=0; count=0
                  while True:
                      i=low.find(needle.lower(),pos)
                      if i<0: break
                      a=max(0,i-500); b=min(len(js),i+1200)
                      sn=re.sub(r'\s+',' ',js[a:b])
                      if sn not in shown:
                          print('\nNEEDLE',needle,'@',i,'\n',sn)
                          shown.add(sn); count+=1
                      pos=i+max(1,len(needle))
                      if count>=8: break
          PY
