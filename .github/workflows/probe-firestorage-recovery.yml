name: Probe firestorage recovery share

on:
  push:
    paths:
      - ".github/workflows/probe-firestorage-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe public share download endpoint
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://firestorage.ai'
          PAGE="$BASE/ja/f/Fg9Q8QsqO0HF"
          curl -LsS "$PAGE" -o /tmp/page.html
          grep -Eo '<script[^>]+src="[^"]+' /tmp/page.html | sed 's/^.*src="//' > /tmp/scripts.txt
          echo '== scripts =='
          cat /tmp/scripts.txt
          : > /tmp/all.js
          while read -r P; do
            echo "GET $P"
            curl -LsS "$BASE$P" >> /tmp/all.js
            echo >> /tmp/all.js
          done < /tmp/scripts.txt
          echo "combined bytes=$(wc -c </tmp/all.js)"
          echo '== endpoint-ish strings =='
          grep -Eo '[/A-Za-z0-9_.?=&{}:%-]{5,}' /tmp/all.js | grep -Ei '(api|download|share|file|presign|public|object|storage)' | sort -u | head -500 || true
          echo '== context =='
          grep -Eio '.{0,220}(fetch\(|axios|download|presign|signed|shareId|publicId|fileId|/api/).{0,500}' /tmp/all.js | head -300 || true
