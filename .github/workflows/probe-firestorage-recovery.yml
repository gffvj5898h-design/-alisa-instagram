name: Probe firestorage recovery share

on:
  push:
    paths:
      - ".github/workflows/probe-firestorage-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe firestorage client chunks
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://firestorage.ai'
          for P in \
            '/_next/static/chunks/4899-d89df949f2dbd5af.js' \
            '/_next/static/chunks/8500-f4d7bfbe7500f274.js' \
            '/_next/static/chunks/8437-d65cc193dc908afa.js' \
            '/_next/static/chunks/5841-1160578ba9bb4f3e.js' \
            '/_next/static/chunks/3794-56f19dc9e2f95fcd.js'; do
            OUT="/tmp/$(basename "$P")"
            CODE=$(curl --max-time 15 -LsS -w '%{http_code}' "$BASE$P" -o "$OUT" || true)
            echo "== $P HTTP=$CODE bytes=$(wc -c <"$OUT" 2>/dev/null || echo 0) =="
            if [ -s "$OUT" ]; then
              grep -Eio '.{0,220}(fetch\(|axios|download|presign|signed|shareId|publicId|fileId|/api/).{0,500}' "$OUT" | head -120 || true
              grep -Eo '[/A-Za-z0-9_.?=&{}:%-]{5,}' "$OUT" | grep -Ei '(api|download|share|file|presign|public|object|storage)' | sort -u | head -200 || true
            fi
          done
