name: Probe firestorage recovery share

on:
  push:
    paths:
      - ".github/workflows/probe-firestorage-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe public share download endpoint
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://firestorage.ai'
          PAGE="$BASE/ja/f/Fg9Q8QsqO0HF"
          curl -LsS "$PAGE" -o /tmp/page.html
          BUNDLE=$(grep -Eo '/_next/static/chunks/app/\(files\)/ja/f/page-[A-Za-z0-9]+\.js' /tmp/page.html | head -1)
          ENC=$(printf '%s' "$BUNDLE" | sed 's/(/%28/g; s/)/%29/g')
          echo "BUNDLE=$BUNDLE"
          echo "ENC=$ENC"
          for P in "$BUNDLE" "$ENC"; do
            echo "== GET $P =="
            CODE=$(curl -LsS -w '%{http_code}' "$BASE$P" -o /tmp/bundle.js)
            echo "HTTP=$CODE bytes=$(wc -c </tmp/bundle.js)"
            head -c 500 /tmp/bundle.js; echo
          done
          echo '== scripts on page =='
          grep -Eo '<script[^>]+src="[^"]+' /tmp/page.html | sed 's/^.*src="//' | head -100 || true
